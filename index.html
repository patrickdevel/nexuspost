<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wartungsarbeiten</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1JNuBX1KLoY-rA54zFz_ocflS-F7HQvHW">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Verhindert jegliches Scrollen */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f3f0f7 0%, #e6f5f7 100%);
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .content-wrapper {
            text-align: center;
            max-width: 480px;
            width: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.8s ease-out;
        }
        .logo {
            width: 25vw;
            max-width: 130px;
            min-width: 80px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.05));
        }
        h1 { 
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 12px 0;
            color: #1a1a1a;
            line-height: 1.2;
        }
        p { 
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            line-height: 1.5; 
            color: #606f7b; 
            margin: 0 0 16px 0;
        }
        .timer {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 600;
            color: #007aff;
            background: rgba(0, 122, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <img src="https://lh3.googleusercontent.com/d/1JNuBX1KLoY-rA54zFz_ocflS-F7HQvHW" alt="Logo" class="logo">
        <h1>Vorübergehend nicht verfügbar</h1>
        <p>Wir arbeiten im Hintergrund an der Website und sind bald wieder für Dich da. Vielen Dank für Deine Geduld!</p>
        <div class="timer" id="countdown">Wir sind in spätestens wird geladen... wieder für dich da.</div>
    </div>

    <script>
        const targetDate = new Date('2026-08-02T12:00:00').getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const countdownEl = document.getElementById('countdown');

            if (distance < 0) {
                countdownEl.innerHTML = "Wir sind jeden Moment wieder für dich da.";
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            let timeString = '';
            if (hours > 0) timeString += `${hours} Std. `;
            if (minutes > 0 || hours > 0) timeString += `${minutes} Min. `;
            timeString += `${seconds} Sek.`;

            countdownEl.innerHTML = `Wir sind in spätestens ${timeString.trim()} wieder für dich da.`;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
