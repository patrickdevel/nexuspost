<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungsarbeiten</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://googleusercontent.com">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f3f0f7 0%, #e6f5f7 100%);
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .content-wrapper {
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }
        .logo {
            width: 40%;
            max-width: 140px;
            min-width: 90px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.05));
        }
        h1 { 
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 15px 0;
            color: #1a1a1a;
        }
        p { 
            font-size: 1rem;
            line-height: 1.6; 
            color: #606f7b; 
            margin: 0;
            padding: 0 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mobile Optimierung für sehr kleine Displays */
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            p { font-size: 0.95rem; }
            .logo { margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <img src="https://googleusercontent.com" alt="Logo" class="logo">
        <h1>Vorübergehend nicht verfügbar</h1>
        <p>Wir arbeiten im Hintergrund an der Website und sind bald wieder für Dich da. Vielen Dank für Deine Geduld!</p>
    </div>
</body>
</html>
